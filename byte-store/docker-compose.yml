version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    container_name: byte_store_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bytestore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      
    
volumes:
  postgres_data: {}


